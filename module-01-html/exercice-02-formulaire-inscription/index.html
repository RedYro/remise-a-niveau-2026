<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulaire d'inscription exercice">
    <title>Exercice : Formulaire d'inscription</title>
</head>
<body>
    <!-- Header de la page -->
    <header>
        <!-- À voir plus tard -->
    </header>
    <!-- Contenu principal -->
    <main>
        <h1>Exercice 2 : Formulaire d'inscription</h1>
        <form action="#" method="post" class="form-inscription">
            <!-- Bloc 1 : identité -->
            <fieldset class="identity">
                <legend>Identité</legend>
                <!-- Pour la civilité -->
                <div class="form-inscription-gender">
                    <fieldset>
                        <legend>
                            Sélectionner votre civilité
                        </legend>
                        <div class="gender-male">
                            <input type="radio" name="gender" id="male" value="Homme">
                            <label for="male">Homme</label>
                        </div>
                        <div class="gender-female">
                            <input type="radio" name="gender" id="female" value="Femme">
                            <label for="female">Femme</label>
                        </div>
                        <div class="gender-other">
                            <input type="radio" name="gender" id="other" value="Autres">
                            <label for="other">Autres</label>
                        </div>
                    </fieldset>
                </div>
                <!-- Pour le nom -->
                <div class="form-inscription-last-name">
                    <label for="last-name">
                        *Nom
                    </label>
                    <input type="text" name="last-name" id="last-name" minlength="2" placeholder="*Champ obligatoire" required>
                </div>
                <!-- Pour le prénom -->
                <div class="form-inscription-first-name">
                    <label for="first-name">
                        *Prénom
                    </label>
                    <input type="text" name="first-name" id="first-name" minlength="2" placeholder="*Champ obligatoire" required>
                </div>
                <!-- Pour la date de naissance -->
                <div class="form-inscription-date-birth">
                    <label for="date-birth">
                        *Date de naissance
                    </label>
                    <input type="date" name="date-birth" id="date-birth" max="2026-10-19" required>
                </div>
                <!-- Pour le numéro de téléphone -->
                <div class="form-inscription-phone-number">
                    <label for="phone">
                        Entrez votre numéro de téléphone : (facultatif) <br>
                        Format : 01 23 45 68 98
                    </label>
                    <input type="tel" name="phone" id="phone" pattern="0[1-9](?: [0-9]{2}){4}">
                </div>
            </fieldset>
            <!-- Bloc 2 : Compte -->
            <fieldset class="account">
                <legend>Compte</legend>
                <!-- Pour le mail -->
                <div class="form-inscription-email">
                    <label for="email">
                        *E-mail
                    </label>
                    <input type="email" name="email" id="email" placeholder="*Champ obligatoire" required>
                </div>
                <!-- Pour le mot de passe -->
                <div class="form-inscription-password">
                    <label for="password">
                        *Mot de passe
                    </label>
                    <input type="password" name="password" id="password" minlength="8" placeholder="*Champ obligatoire" required>
                </div>
                <!-- Pour la confirmation du mot de passe -->
                <div class="form-inscription-confirm-password">
                    <label for="confirm-password">
                        *Confirmer mot de passe
                    </label>
                    <input type="password" name="confirm-password" id="confirm-password" minlength="8" placeholder="*Champ obligatoire" required>
                </div>
            </fieldset>
            <!-- Bloc 3 : Préférences -->
            <fieldset class="preference">
                <legend>Préférences</legend>
                <!-- Pour la ville ou le département -->
                <div class="form-inscription-departments">
                    <label for="departments-select">
                        Choisissez votre département : 
                    </label>
                    <select name="departments" id="departments-select">
                        <option value="">
                            --Veuillez choisir votre département--
                        </option>
                        <option value="Essonne">Essonne 91000</option>
                        <option value="Val-de-Marne">Val-de-Marne 94000</option>
                    </select>
                </div>
                <!-- Pour le genre de film -->
                <div class="form-inscription-preference-film">
                    <fieldset>
                        <legend>
                            Sélectionner le ou les genre(s) de films
                        </legend>
                        <div class="film-action">
                            <input type="checkbox" name="preference-film" id="action-film" value="Film d'action">
                            <label for="action-film">Film d'action</label>
                        </div>
                        <div class="film-aventure">
                            <input type="checkbox" name="preference-film" id="adventure-film" value="Film d'aventure">
                            <label for="adventure-film">Film d'aventure</label>
                        </div>
                        <div class="film-fantaisie">
                            <input type="checkbox" name="preference-film" id="fantasy-film" value="Film de fantaisie">
                            <label for="fantasy-film">Film de fantaisie</label>
                        </div>
                    </fieldset>
                </div>
                <!-- Pour se présenter -->
                <div class="about-yourself">
                    <label for="description-about-yourself">
                        Décrivez-vous :
                    </label>
                    <textarea name="description-about-yourself" id="description-about-yourself" rows="5" cols="30" maxlength="300" placeholder="Présentez-vous, quels genres de films vous aimez ?"></textarea>
                </div>
            </fieldset>
            <!-- Bloc 4 : Validation -->
            <fieldset class="validation">
                <legend>Validation</legend>
                <!-- Pour demander à recevoir les newsletter ou non -->
                <div class="form-inscription-newletter">
                    <label>
                        <input type="checkbox" name="subscribe">
                        Recevoir la Newsletter
                    </label>
                </div>
                <!-- Pour accepter les CGU -->
                <div class="form-inscription-cgu">
                    <label>
                        <input type="checkbox" name="cgu" required>
                        *Accepter les CGU
                    </label>
                </div>
                <!-- Pour confirmer le formulaire -->
                <div class="submit-form">
                    <button type="submit">Créer mon compte</button>
                </div>
            </fieldset>
        </form>
    </main>
    <!-- Footer de la page -->
    <footer>
        <!-- À voir plus tard -->
    </footer>
</body>
</html>
